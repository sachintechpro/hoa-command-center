databases:
  - name: hoa-command-center-db
    plan: free
    databaseName: hoa_command_center
    user: hoa_app

services:
  - type: web
    name: hoa-command-center
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hoa-command-center-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.8
